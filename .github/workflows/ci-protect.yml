name: CI Protect

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-axon:
    name: verify-axon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify compiler and smoke test
        run: |
          chmod +x ./bin/axc-linux-x64
          ./bin/axc-linux-x64 check compiler_ax/main.ax
          ./bin/axc-linux-x64 test tests/pass/01_pythonic_named_fstr.ax
