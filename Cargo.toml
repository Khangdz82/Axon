[workspace]
resolver = "2"
members = [
    "crates/axon_span",
    "crates/axon_lexer",
    "crates/axon_ast",
    "crates/axon_parser",
    "crates/axc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
logos = "0.14"
lasso = { version = "0.7", features = ["multi-threaded"] }
bumpalo = { version = "3.16", features = ["collections"] }
thiserror = "2.0"
