<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Axon Native Dashboard</title>
    <style>
        .custom-glow {
            border: 2px solid #38bdf8;
        }
        .header-title {
            color: #38bdf8;
            font-size: 24px;
        }
    </style>
</head>
<body class="flex flex-col gap-4 p-6 bg-slate-900">
    <!-- Header with Tailwind Flex and Bootstrap Badge -->
    <header class="flex justify-between items-center p-4 bg-slate-800 rounded-lg">
        <h1 class="header-title font-bold">Axon Zero-CEF Desktop App</h1>
        <span class="badge bg-primary">v1.0 Native</span>
    </header>

    <!-- Main Content Grid with Cards -->
    <main class="flex flex-col gap-4">
        <!-- Interactive Card with Tailwind & Bootstrap -->
        <div id="stat-card" class="card p-6 bg-slate-800 rounded-xl custom-glow">
            <h2 class="text-white font-semibold">Native Performance Monitor</h2>
            <p id="status-desc" class="text-slate-400 my-2">Engine: Zero Chromium / Zero CEF / Pure Native CPU</p>
            
            <div class="flex gap-4 my-2">
                <span id="click-counter" class="text-emerald-400 font-bold">Clicks: 0</span>
            </div>

            <!-- Standard HTML Button with DOM JavaScript onclick -->
            <button id="btn-click" class="btn btn-primary" onclick="document.getElementById('click-counter').innerText = 'Clicks: 1 (Reactive Event Fired!)'">
                Click to Test Reactivity
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="alert alert-success">
            <strong>Success:</strong> HTML5 DOM, Tailwind CSS & JS loaded natively without Chromium overhead!
        </div>
    </main>
</body>
</html>
