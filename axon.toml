[package]
name = "axon"
version = "0.11.0"
authors = ["Axon Systems Engineering"]
edition = "2026"

[compiler]
entry = "compiler_ax/main.ax"
target = "native"
opt-level = "release"
simd = "auto"
backend = "direct-machine-code"
max-compile-time-ms = 15
max-binary-size-mb = 1.5
incremental = true
cache-dir = ".axon_cache"
tree-shake = true
pgo = true

[build]
out-dir = "bin"
strip = true
