[package]
name = "axon"
version = "0.31.0"
authors = ["Axon Systems Engineering"]
edition = "2026"

[compiler]
entry = "compiler_ax/main.ax"
target = "native"
opt-level = "release"
simd = "auto"
backend = "direct-machine-code"
max-compile-time-ms = 15
max-binary-size-mb = 1.5
incremental = true
cache-dir = ".axon_cache"
tree-shake = true
pgo = true
fmv = true
ultra = true
pythonic = true
c-bridge = true
egraph = true
quant-simd = true
tensor = true
autograd = true
gpu-codegen = true
anti-tamper = true
shield = true
secret = true
sealed-weights = true
inline-asm = true
hugepages = true
flash-kernels = true
bundle = true
axpak = true
sign = true
whitebox = true
mxfp = true
neumaier = true
remat = true
fused-optimizers = true
moe = true
parallel-scan = true
grpo = true
shard = true
tensor-cores = true
npu = true
prove = true
unikernel = true
live = true

[build]
out-dir = "bin"
strip = true
