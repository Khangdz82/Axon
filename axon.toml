[package]
name = "axon"
version = "1.0.0"
authors = ["Axon Systems Engineering"]
edition = "2026"

[compiler]
entry = "compiler_ax/main.ax"
target = "native"
cross-targets = [
    "win-x64",
    "linux-x64",
    "linux-arm64",
    "macos-arm64",
    "macos-x64",
    "wasm32",
    "unikernel-x64",
    "freestanding-x64",
    "freestanding-riscv64",
    "spirv",
    "ptx",
]
opt-level = "release"
simd = "cpuid-auto-scalar-avx2-avx512-neon-simd128"
backend = "direct-machine-code"
comptime-vm = true
c-header-import = true
static-coff-linker = true
multicore-par-for = true
native-async-iocp = true
symbolic-tensor-shapes = true
paged-kv-cache = true
dlpack-zero-copy = true
nan-guard-hardware-trap = true
taint-tracking = true
no-alloc-verifier = true
perceus-ownership = true
perceus-loop-self-fbip = true
soa-dead-column-elim = true
temporal-avx2-tiling = true
polymorphic-shield-v2 = true
whitebox-gf256 = true
capability-security = true
av-clean-pe32plus = true
mcp-jsonrpc-server = true

[build]
out-dir = "bin"
strip = true
