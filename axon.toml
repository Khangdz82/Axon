[package]
name = "axon"
version = "6.0.0"
authors = ["Axon Systems Engineering"]
edition = "2026"

[compiler]
entry = "compiler_ax/main.ax"
target = "native"
opt-level = "release"
simd = "avx2-fma3"
backend = "direct-machine-code"
max-compile-time-ms = 15
max-binary-size-mb = 0.60
tree-shake = true
const-fn-inline = true
disp8-compact-encoding = true
branch-fusion = true
on-demand-runtime = true
perceus-ownership = true
perceus-loop-self-fbip = true
soa-dead-column-elim = true
temporal-avx2-tiling = true
polymorphic-shield-v2 = true
secret-rolling-cipher = true
whitebox-gf256 = true
capability-security = true
av-clean-pe32plus = true

[build]
out-dir = "bin"
strip = true
