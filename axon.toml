[package]
name = "axon"
version = "0.8.0"
authors = ["Axon Systems Engineering"]
edition = "2026"

[compiler]
entry = "compiler_ax/main.ax"
target = "native"
opt-level = "release"
simd = "auto"
backend = "direct-machine-code"
max-compile-time-ms = 150
max-binary-size-mb = 3.0

[build]
out-dir = "bin"
strip = true
